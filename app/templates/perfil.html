<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil - PlanGym</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/calendario.css') }}">
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo"><span>Plan</span>Gym</div>

        <nav>
            <a class="nav-item" href="/principal">Inicio</a>
            <a class="nav-item" href="/principal#rutinas">Rutinas</a>
            <a class="nav-item" href="/principal#calendario">Calendario</a>
            <a class="nav-item" href="/principal#ejercicios">Ejercicios</a>
            <a class="nav-item active" href="/perfil/">Perfil</a>
        </nav>

        <div class="sidebar-bottom">
            <div class="user-box">
                <div class="avatar">{{ usuario.nombre[0] | upper }}</div>
                <span>{{ usuario.nombre }}</span>
            </div>
            <a href="/auth/logout">Cerrar sesion</a>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1>Perfil</h1>
            <p>{{ usuario.email }}</p>
        </header>

        <section class="content">
            <div class="stats">
                <div class="card">
                    <span>Rutinas</span>
                    <h2>{{ stats.total_rutinas }}</h2>
                </div>
                <div class="card">
                    <span>Dias completados</span>
                    <h2>{{ stats.total_dias }}</h2>
                </div>
            </div>

            <div class="panel">
                <h3>Cambiar nombre</h3>
                <form action="{{ url_for('perfil_bp.cambiar_nombre') }}" method="POST">
                    <input type="text" name="nombre" value="{{ usuario.nombre }}" minlength="3" required>
                    <button type="submit">Guardar nombre</button>
                </form>
            </div>

            <div class="panel">
                <h3>Cambiar contrasena</h3>
                <form action="{{ url_for('perfil_bp.cambiar_password') }}" method="POST">
                    <input type="password" name="password" placeholder="Nueva contrasena" minlength="6" required>
                    <button type="submit">Guardar contrasena</button>
                </form>
            </div>
        </section>
    </main>
</div>

</body>
</html>
